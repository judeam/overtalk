[package]
name = "overtalk-worker-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5.0.1"
tempfile = "3"
fs2 = "0.4"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "overtalk-worker"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Pipes"] }
