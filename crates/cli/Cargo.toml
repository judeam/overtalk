[package]
name = "overtalk-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Command line and MCP access to the Overtalk meeting library, for people, scripts and AI assistants"

[[bin]]
name = "overtalk-cli"
path = "src/main.rs"

[dependencies]
overtalk-library-reads = { path = "../library-reads" }
serde_json = { workspace = true }
# Same libsqlite3-sys as the engine's sqlx; bundled so no system SQLite is needed.
rusqlite = { version = "0.32.1", features = ["bundled"] }
# A fresh nonce for each proof the app must give before the token is sent.
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.3"
