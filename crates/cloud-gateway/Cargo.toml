[package]
name = "overtalk-cloud-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
http-body-util = "0.1.3"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful", "http1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
ring = "0.17"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
# Stripe and the inference provider are verified against the bundled Mozilla roots.
webpki-root-certs = "1.0.10"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
