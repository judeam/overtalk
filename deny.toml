# Source and license policy; advisory reachability and verified backports are
# checked by scripts/audit-dependencies.py.
# Run: cargo deny --locked check sources licenses
[licenses]
confidence-threshold = 0.9
# Permissive licenses, MPL-2.0 for unmodified crates (source stays on crates.io)
# and Slint's royalty-free license, whose attribution is the About dialog.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/emotechlab/silero-rs",
    "https://github.com/yury/cidre",
]
